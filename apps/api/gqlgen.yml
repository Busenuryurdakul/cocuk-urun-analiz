# gqlgen configuration — Miyuna API
schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind: []

models:
  AnalysisRun:
    fields:
      evidence:
        resolver: true
      safetyFindings:
        resolver: true
      recalls:
        resolver: true
      reviewInsights:
        resolver: true
      finalResult:
        resolver: true
