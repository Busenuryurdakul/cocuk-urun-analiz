# Miyuna dev infrastructure — internal services only (not public in production)
services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - miyuna_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: miyuna
      MINIO_ROOT_PASSWORD: miyuna-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miyuna_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  miyuna_mongo_data:
  miyuna_minio_data:
