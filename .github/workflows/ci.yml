name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/**"
      - "chore/**"
      - "fix/**"

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      MONGODB_URI: mongodb://localhost:27017/miyuna_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-jwt-secret-key-32chars!
      PYTHON_EXECUTABLE: python
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent orchestrator
        working-directory: apps/agent
        run: pip install -e ".[dev]"
      - name: Verify agent import
        run: python -c "import miyuna_agent"
        working-directory: apps/agent
      - run: go mod download
      - name: Verify gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
